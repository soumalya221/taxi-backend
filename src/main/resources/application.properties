# =========================
# DATABASE
# =========================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taxi_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2486}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# SERVER
# =========================

server.port=${PORT:8080}

# =========================
# OPENROUTESERVICE / HEIGIT
# =========================

openrouteservice.api.url=${OPENROUTESERVICE_API_URL:https://api.heigit.org}
openrouteservice.api.key=${OPENROUTESERVICE_API_KEY:}

openrouteservice.geocode.url=${OPENROUTESERVICE_GEOCODE_URL:https://api.heigit.org/pelias/v1/autocomplete}